<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reg Navigator</title>

<!-- ═══ SET THIS ONE LINE: your Reg Navigator web-app /exec URL ═══ -->
<script>var APP_URL = 'PASTE_YOUR_EXEC_URL_HERE';</script>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#07090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RegNav">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#07090d;overflow:hidden}
  body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
       padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  #frame{width:100%;height:100%;border:0;display:block;background:#07090d}
  /* boot screen */
  #boot{position:fixed;inset:0;background:#07090d;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:22px;z-index:10;transition:opacity .45s}
  #boot.gone{opacity:0;pointer-events:none}
  #boot svg{width:96px;height:96px;filter:drop-shadow(0 0 18px rgba(176,107,255,.55));animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #boot .t{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;letter-spacing:.28em;
        text-transform:uppercase;background:linear-gradient(90deg,#b06bff,#3fc6ff,#3dffa0);
        -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
  #boot .s{font-family:monospace;font-size:11px;color:#54627a}
  /* offline / config notices */
  .notice{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
        max-width:92vw;background:#0d1117;border:1px solid #ff4d6d;color:#ff9aac;border-radius:12px;
        padding:12px 18px;font:12.5px monospace;z-index:20;box-shadow:0 0 18px rgba(255,77,109,.25);display:none;text-align:center}
  .notice.show{display:block}
  /* Android install nudge */
  #installbar{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
        background:#0d1117;border:1px solid #b06bff;border-radius:999px;padding:10px 18px;z-index:20;
        display:none;align-items:center;gap:12px;box-shadow:0 0 22px rgba(176,107,255,.35)}
  #installbar.show{display:flex}
  #installbar span{font:13px -apple-system,'Segoe UI',Roboto,sans-serif;color:#e6edf3}
  #installbar button{background:linear-gradient(135deg,#b06bff,#3fc6ff);border:none;color:#07090d;
        border-radius:999px;padding:8px 16px;font-weight:700;font-size:12px;cursor:pointer}
  #installbar .x{background:none;color:#8b98a9;font-size:15px;padding:4px 6px}
</style>
</head>
<body>

<div id="boot">
  <svg viewBox="0 0 40 40" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b06bff"/><stop offset=".5" stop-color="#3fc6ff"/><stop offset="1" stop-color="#3dffa0"/>
    </linearGradient></defs>
    <circle cx="20" cy="20" r="18" fill="none" stroke="url(#g)" stroke-width="2"/>
    <circle cx="20" cy="20" r="12" fill="none" stroke="url(#g)" stroke-width="1.5" opacity=".7"/>
    <circle cx="20" cy="20" r="6"  fill="none" stroke="url(#g)" stroke-width="1.2" opacity=".5"/>
    <circle cx="20" cy="20" r="2.2" fill="#3fc6ff"/>
  </svg>
  <div class="t">Reg Navigator</div>
  <div class="s" id="bootmsg">initializing…</div>
</div>

<iframe id="frame" allow="microphone; camera; clipboard-write; clipboard-read" title="Reg Navigator"></iframe>

<div class="notice" id="cfgnote">Shell not configured — open index.html and set APP_URL to your Reg Navigator /exec URL.</div>
<div class="notice" id="offnote">You're offline. Reg Navigator needs a connection to reason and verify — reconnect and pull to refresh.</div>

<div id="installbar">
  <span>Install Reg Navigator?</span>
  <button id="installbtn">Install</button>
  <button class="x" id="installdismiss">✕</button>
</div>

<script>
'use strict';
(function(){
  var frame = document.getElementById('frame');
  var boot = document.getElementById('boot');
  var bootmsg = document.getElementById('bootmsg');

  // Config guard
  if(!APP_URL || APP_URL.indexOf('PASTE_YOUR') === 0){
    document.getElementById('cfgnote').classList.add('show');
    bootmsg.textContent = 'awaiting configuration';
  } else {
    bootmsg.textContent = 'connecting to reasoning engine…';
    frame.src = APP_URL;
    var hidden = false;
    var hide = function(){
      if(hidden) return; hidden = true;
      boot.classList.add('gone');
      setTimeout(function(){ boot.style.display = 'none'; }, 500);
    };
    frame.addEventListener('load', hide);
    setTimeout(hide, 9000); // never trap the user on the boot screen
  }

  // Online/offline
  var off = document.getElementById('offnote');
  window.addEventListener('offline', function(){ off.classList.add('show'); });
  window.addEventListener('online',  function(){ off.classList.remove('show'); location.reload(); });
  if(!navigator.onLine) off.classList.add('show');

  // Service worker (installability on Android/Chrome)
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* non-fatal */ });
  }

  // Android custom install prompt
  var deferred = null;
  var bar = document.getElementById('installbar');
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferred = e;
    if(!window.matchMedia('(display-mode: standalone)').matches) bar.classList.add('show');
  });
  document.getElementById('installbtn').addEventListener('click', function(){
    bar.classList.remove('show');
    if(deferred){ deferred.prompt(); deferred = null; }
  });
  document.getElementById('installdismiss').addEventListener('click', function(){ bar.classList.remove('show'); });
  window.addEventListener('appinstalled', function(){ bar.classList.remove('show'); });
})();
</script>
</body>
</html>
