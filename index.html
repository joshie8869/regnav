<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0F1915;overflow:hidden}
  body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
       padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  #frame{width:100%;height:100%;border:0;display:block;background:#0F1915}
  /* boot screen */
  #boot{position:fixed;inset:0;background:#0F1915;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:22px;z-index:10;transition:opacity .45s}
  #boot.gone{opacity:0;pointer-events:none}
  #boot svg{width:120px;height:24px;filter:drop-shadow(0 0 10px rgba(0,229,255,.45))}
  #boot .pulse-path{fill:none;stroke:url(#bootGrad);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;
        stroke-dasharray:420;stroke-dashoffset:420;animation:pulseDraw 2.6s linear infinite}
  @keyframes pulseDraw{to{stroke-dashoffset:0}}
  #boot .t{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;letter-spacing:.28em;
        text-transform:uppercase;background:linear-gradient(90deg,#00e5ff,#ff2e9a);
        -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
  #boot .s{font-family:monospace;font-size:11px;color:#6d786f}
  /* offline / config notices */
  .notice{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
        max-width:92vw;background:#141F1B;border:1px solid #ff3b5c;color:#ff9aac;border-radius:12px;
        padding:12px 18px;font:12.5px monospace;z-index:20;box-shadow:0 0 18px rgba(255,59,92,.25);display:none;text-align:center}
  .notice.show{display:block}
  /* Android install nudge */
  #installbar{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
        background:#141F1B;border:1px solid #00e5ff;border-radius:999px;padding:10px 18px;z-index:20;
        display:none;align-items:center;gap:12px;box-shadow:0 0 22px rgba(0,229,255,.30)}
  #installbar.show{display:flex}
  #installbar span{font:13px -apple-system,'Segoe UI',Roboto,sans-serif;color:#ECE6D8}
  #installbar button{background:linear-gradient(135deg,#00e5ff,#ff2e9a);border:none;color:#05050b;
        border-radius:999px;padding:8px 16px;font-weight:700;font-size:12px;cursor:pointer}
  #installbar .x{background:none;color:#6d786f;font-size:15px;padding:4px 6px}
</style>
</head>
<body>

<div id="boot">
  <svg viewBox="0 0 300 30" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="bootGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#ff2e9a"/>
    </linearGradient></defs>
    <path class="pulse-path" d="M0,15 L58,15 L70,15 L78,2 L90,28 L100,15 L118,15 L300,15"/>
  </svg>
  <div class="t">VITALS</div>
  <div class="s" id="bootmsg">initializing…</div>
</div>

<iframe id="frame" allow="clipboard-write; clipboard-read" title="VITALS"></iframe>

<div class="notice" id="cfgnote">Shell not configured — open index.html and set APP_URL to your VITALS /exec URL.</div>
<div class="notice" id="offnote">You're offline. VITALS needs a connection to load your data — reconnect and pull to refresh.</div>

<div id="installbar">
  <span>Install VITALS?</span>
  <button id="installbtn">Install</button>
  <button class="x" id="installdismiss">✕</button>
</div>

<script>
'use strict';
(function(){
  var frame = document.getElementById('frame');
  var boot = document.getElementById('boot');
  var bootmsg = document.getElementById('bootmsg');

  // Config guard
  if(!APP_URL || APP_URL.indexOf('PASTE_YOUR') === 0){
    document.getElementById('cfgnote').classList.add('show');
    bootmsg.textContent = 'awaiting configuration';
  } else {
    bootmsg.textContent = 'loading dashboard…';
    var act = new URLSearchParams(location.search).get('action');
    frame.src = APP_URL + (act ? (APP_URL.indexOf('?') > -1 ? '&' : '?') + 'action=' + encodeURIComponent(act) : '');
    var hidden = false;
    var hide = function(){
      if(hidden) return; hidden = true;
      boot.classList.add('gone');
      setTimeout(function(){ boot.style.display = 'none'; }, 500);
    };
    frame.addEventListener('load', hide);
    setTimeout(hide, 9000); // never trap the user on the boot screen
  }

  // Online/offline
  var off = document.getElementById('offnote');
  window.addEventListener('offline', function(){ off.classList.add('show'); });
  window.addEventListener('online',  function(){ off.classList.remove('show'); location.reload(); });
  if(!navigator.onLine) off.classList.add('show');

  // Service worker (installability on Android/Chrome)
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* non-fatal */ });
  }

  // Android custom install prompt
  var deferred = null;
  var bar = document.getElementById('installbar');
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferred = e;
    if(!window.matchMedia('(display-mode: standalone)').matches) bar.classList.add('show');
  });
  document.getElementById('installbtn').addEventListener('click', function(){
    bar.classList.remove('show');
    if(deferred){ deferred.prompt(); deferred = null; }
  });
  document.getElementById('installdismiss').addEventListener('click', function(){ bar.classList.remove('show'); });
  window.addEventListener('appinstalled', function(){ bar.classList.remove('show'); });
})();
</script>
</body>
</html>
